version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: trackora_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trackora
    networks:
      - trackora_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trackora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trackora_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackora_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/trackora
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=trackora_jwt_secret_key_change_in_production_12345
      - JWT_REFRESH_SECRET=trackora_jwt_refresh_secret_key_change_in_production_54321
      - FCM_PROJECT_ID=trackora-fcm
      - FCM_CLIENT_EMAIL=firebase-adminsdk@trackora-fcm.iam.gserviceaccount.com
      - FCM_PRIVATE_KEY=-----BEGIN PRIVATE KEY-----\nMOCK_KEY\n-----END PRIVATE KEY-----
      - CLOUDINARY_URL=cloudinary://mock_key:mock_secret@mock_cloud
      - AUTO_LOGOUT_MINUTES=15
    depends_on:
      - db
      - redis
    networks:
      - trackora_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: trackora_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin-dashboard/dist:/usr/share/nginx/html/app:ro
    depends_on:
      - backend
    networks:
      - trackora_network
    restart: unless-stopped

networks:
  trackora_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
