<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackora | Unified Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #090d16;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            animation: fadeInUp 0.5s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        h1 span {
            color: #6366f1;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
            border-color: #6366f1;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.15);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }
        .card p {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0;
        }
        .admin-glow:hover { border-color: #f43f5e; box-shadow: 0 10px 30px rgba(244, 63, 94, 0.15); }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Trackora Logo" style="width: 120px; margin-bottom: 1rem; border-radius: 20px;">
        <h1>Welcome to <span>Trackora</span></h1>
        <p>Your ultimate daily life tracking and productivity platform.</p>
        
        <div class="grid">
            <a href="/admin/" class="card admin-glow">
                <div class="icon">💻</div>
                <h2>Trackora App</h2>
                <p>Manage your habits, goals, and tasks in one place.</p>
            </a>
            <a href="https://example.com/support" class="card">
                <div class="icon">📱</div>
                <h2>Help & Support</h2>
                <p>View our documentation and contact the team.</p>
            </a>
        </div>
    </div>
</body>
</html>
